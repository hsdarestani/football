function loginPage(){return `<main class="login"><section class="login-visual"><div>${logo()}</div><h1>One office.<br><span>Every move.</span></h1><div class="eyebrow">Secure player & management workspace</div></section><section class="login-wrap"><div class="login-panel"><div class="eyebrow">Atlasgames access</div><h2>Willkommen zurück.</h2><p>Wähle eine Rolle. Die Demo ist direkt befüllt und alle Änderungen werden lokal gespeichert.</p><div class="roles"><button class="role ${ui.role==='management'?'active':''}" data-role-select="management"><b>Management</b><span>All players & operations</span></button><button class="role ${ui.role==='player'?'active':''}" data-role-select="player"><b>Player</b><span>Personal workspace</span></button></div><div class="field"><label>E-Mail</label><input id="login-email" value="${ui.role==='management'?'management@atlasgames.demo':'younes@atlasgames.demo'}"></div><div class="field"><label>Passwort</label><input type="password" value="demo2026"></div><div class="demo-note">Demo credentials are pre-filled. No real personal or medical information is transmitted.</div><button class="btn blue" style="width:100%" data-action="enter">Demo öffnen</button><button class="btn" style="width:100%;margin-top:8px" data-action="public">Zurück zur Website</button></div></section></main>`}
const managementNav=[['dashboard','home','Command Center'],['players','users','Players'],['tasks','tasks','Tasks'],['calendar','calendar','Calendar'],['messages','messages','Messages'],['documents','docs','Documents'],['contracts','contracts','Contracts'],['transfers','transfers','Transfer Desk'],['scouting','scouting','Scouting'],['medical','medical','Medical'],['travel','travel','Travel'],['sponsors','sponsors','Sponsors'],['analytics','analytics','Analytics']];const playerNav=[['myspace','home','My Space'],['calendar','calendar','Calendar'],['messages','messages','Messages'],['documents','docs','Documents'],['travel','travel','Travel'],['analytics','analytics','Performance'],['sponsors','sponsors','Sponsors']];
function shell(){const nav=ui.role==='management'?managementNav:playerNav;const p=byId(ui.selectedPlayer)||db.players[1];return `<main class="shell"><aside class="sidebar"><div class="side-logo">${logo()}</div><div class="side-section">${ui.role==='management'?'Football office':'Player portal'}</div>${nav.map(n=>`<button class="nav-btn ${ui.route===n[0]?'active':''}" data-route="${n[0]}"><span class="nicon">${ICONS[n[1]]}</span>${n[2]}</button>`).join('')}<div class="side-bottom"><div class="user-chip"><div class="avatar photo" style="background-image:url('${ui.role==='management'?photos.stadium:p.photo}')"></div><div><b>${ui.role==='management'?'Atlasgames Team':p.name}</b><small>${ui.role==='management'?'Administrator':p.club}</small></div></div><button class="nav-btn" style="margin-top:8px" data-action="logout"><span class="nicon">↗</span>Logout</button></div></aside><section class="workspace"><header class="topbar"><button class="btn icon mobile-menu" data-action="menu">☰</button><div class="crumb"><small>${ui.role==='management'?'Atlasgames Management':'Player Workspace'}</small><b>${routeTitle()}</b></div><label class="global-search">⌕ <input placeholder="Search players, tasks, documents…" id="global-search"></label><div class="top-actions"><button class="btn icon" data-action="notifications">●</button><button class="btn icon" data-action="reset">↻</button></div></header><div class="content">${routeView()}</div></section></main>`}
function routeTitle(){return ({dashboard:'Command Center',players:'Players',tasks:'Tasks',calendar:'Calendar',messages:'Messages',documents:'Documents',contracts:'Contracts',transfers:'Transfer Desk',scouting:'Scouting',medical:'Medical',travel:'Travel',sponsors:'Sponsors',analytics:ui.role==='player'?'Performance':'Analytics',myspace:'My Space'})[ui.route]||'Atlasgames'}
function head(title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${ui.role==='management'?'Management workspace':'Player workspace'}</div><h1>${title}</h1><p>${desc}</p></div><div class="page-actions">${actions}</div></div>`}
function dashboard(){const total=db.players.reduce((a,p)=>a+p.value,0);const active=db.tasks.filter(t=>t.stage!=='Done').length;const p=byId(2);return `${head('Command Center','Today’s priorities, player status and live business signals.',`<button class="btn primary" data-open="task">＋ New task</button>`)}<section class="focus reveal"><div class="focus-img"><div class="focus-copy"><span class="tag green">Player focus</span><h2>${p.name}</h2><p>${p.club} · ${p.position} · ${money(p.value)}</p></div></div><div class="focus-side"><div><div class="eyebrow">Today’s briefing</div><h3>Contract, brand & performance aligned.</h3><p>The Frankfurt addendum is awaiting final confirmation. Medical status is fit and the next sponsor campaign is in negotiation.</p><div class="focus-facts"><div><small>Contract</small><b>Until 2031</b></div><div><small>Rating</small><b>${p.rating}/100</b></div><div><small>Next event</small><b>27 Jul</b></div></div></div><div class="hero-actions"><button class="btn primary sm" data-player="2">Open player</button><button class="btn sm" data-route="messages">Message</button></div></div></section><div class="grid metrics reveal"><article class="metric dark"><small>Portfolio value</small><strong>€${total.toFixed(1)}m</strong><span>15 represented players</span></article><article class="metric"><small>Open actions</small><strong>${active}</strong><span>Across legal, care and brand</span></article><article class="metric"><small>Transfer cases</small><strong>${db.deals.length}</strong><span>${db.deals.filter(d=>d.stage==='Offer').length} offer in review</span></article><article class="metric"><small>Unread messages</small><strong>${db.notifications.filter(n=>!n.read).length}</strong><span>Needs attention today</span></article></div><div class="grid two" style="margin-top:12px"><section class="panel reveal"><div class="panel-head"><h3>Priority actions</h3><button class="btn sm" data-route="tasks">View board</button></div><div class="panel-body list">${db.tasks.filter(t=>t.stage!=='Done').slice(0,5).map(t=>rowTask(t)).join('')}</div></section><section class="panel reveal"><div class="panel-head"><h3>Upcoming schedule</h3><button class="btn sm" data-route="calendar">Calendar</button></div><div class="panel-body list">${db.events.slice(0,5).map(e=>`<div class="row"><div class="avatar">${e.date.slice(-2)}</div><div><b>${e.title}</b><small>${dateFmt(e.date)} · ${e.time} · ${e.location}</small></div><span class="tag ${e.type==='Medical'?'red':e.type==='Match'?'green':''}">${e.type}</span></div>`).join('')}</div></section></div><section class="panel reveal" style="margin-top:12px"><div class="panel-head"><h3>Quick actions</h3></div><div class="panel-body quick">${[['player','＋ Player'],['task','✓ Task'],['event','◫ Event'],['document','▤ Document'],['deal','⇄ Transfer'],['trip','✈ Travel'],['medical','✚ Medical'],['sponsor','◆ Sponsor']].map(x=>`<button data-open="${x[0]}"><b>${x[1]}</b><span>Create a sample record</span></button>`).join('')}</div></section>`}
function rowTask(t){const p=byId(t.playerId);return `<div class="row"><div class="avatar">${initials(p?.name||'AG')}</div><div><b>${t.title}</b><small>${p?.name||'General'} · ${t.owner} · due ${dateFmt(t.due)}</small></div><span class="tag ${t.priority==='High'?'red':t.priority==='Medium'?'amber':'green'}">${t.stage}</span></div>`}
function players(){const filtered=db.players.filter(p=>(p.name+' '+p.club+' '+p.position).toLowerCase().includes(ui.search.toLowerCase()));const p=byId(ui.selectedPlayer)||filtered[0];return `${head('Players','A living CRM for the complete Atlasgames roster.',`<button class="btn primary" data-open="player">＋ Add player</button>`)}<div class="player-layout"><section class="panel"><div class="panel-head"><h3>${filtered.length} players</h3><input id="player-search" placeholder="Search roster" value="${esc(ui.search)}" style="border:1px solid #dde4e8;border-radius:999px;padding:7px 10px;font-size:9px"></div><div class="player-list">${filtered.map(x=>`<div class="player-item ${x.id===ui.selectedPlayer?'active':''}" data-player="${x.id}"><div class="avatar photo" style="background-image:url('${x.photo}')"></div><div><b>${x.name}</b><small>${x.club} · ${x.position}</small></div><span class="value">${money(x.value)}</span></div>`).join('')}</div></section>${p?playerDetail(p):'<section class="panel empty"><b>No player selected</b></section>'}</div>`}
function playerDetail(p){const tasks=db.tasks.filter(x=>x.playerId===p.id),docs=db.docs.filter(x=>x.playerId===p.id),contract=db.contracts.find(x=>x.playerId===p.id);return `<section class="panel player-detail"><div class="cover" style="background-image:url('${p.photo}')"><div class="cover-info"><div><span class="tag green">${p.status}</span><h2>${p.name}</h2><p>${p.club} · #${p.number} · ${p.position}</p></div><button class="btn primary sm" data-edit-player="${p.id}">Edit profile</button></div></div><div class="detail-tabs">${['overview','tasks','documents','contract','performance'].map(t=>`<button class="${ui.playerTab===t?'active':''}" data-player-tab="${t}">${t}</button>`).join('')}</div><div class="detail-content">${ui.playerTab==='overview'?`<div class="facts"><div class="fact"><small>Market value</small><b>${money(p.value)}</b></div><div class="fact"><small>Age</small><b>${p.age}</b></div><div class="fact"><small>Nation</small><b>${p.nation}</b></div><div class="fact"><small>Rating</small><b>${p.rating}/100</b></div></div><div class="grid two" style="margin-top:12px"><div class="panel"><div class="panel-head"><h3>Current focus</h3></div><div class="panel-body list">${tasks.slice(0,4).map(rowTask).join('')||'<div class="empty">No tasks</div>'}</div></div><div class="panel"><div class="panel-head"><h3>Profile notes</h3></div><div class="panel-body"><p style="font-size:10px;line-height:1.7;color:#65737e">Sample internal note: maintain weekly player-care check-in, align media activity with match schedule and review contract milestones quarterly.</p></div></div></div>`:ui.playerTab==='tasks'?`<div class="list">${tasks.map(rowTask).join('')||'<div class="empty">No tasks</div>'}</div>`:ui.playerTab==='documents'?docsTable(docs):ui.playerTab==='contract'?contract?`<div class="facts"><div class="fact"><small>Club</small><b>${contract.club}</b></div><div class="fact"><small>Start</small><b>${dateFmt(contract.start)}</b></div><div class="fact"><small>End</small><b>${dateFmt(contract.end)}</b></div><div class="fact"><small>Status</small><b>${contract.status}</b></div></div>`:'<div class="empty">No contract record</div>':`<div class="grid metrics"><div class="metric"><small>Overall</small><strong>${p.rating}</strong><span>Performance index</span></div><div class="metric"><small>Availability</small><strong>94%</strong><span>Last 90 days</span></div><div class="metric"><small>Minutes</small><strong>1,642</strong><span>Season sample</span></div><div class="metric"><small>Impact</small><strong>+12%</strong><span>vs. previous period</span></div></div>`}</div></section>`}
function tasks(){const stages=['Today','In progress','Waiting','Done'];return `${head('Tasks','Operational work that can be created, moved and completed.',`<button class="btn primary" data-open="task">＋ New task</button>`)}<div class="kanban">${stages.map(s=>`<section class="kan-col" data-drop-stage="${s}"><div class="kan-head"><b>${s}</b><span>${db.tasks.filter(t=>t.stage===s).length}</span></div>${db.tasks.filter(t=>t.stage===s).map(t=>`<article class="task" draggable="true" data-task="${t.id}"><span class="tag ${t.priority==='High'?'red':t.priority==='Medium'?'amber':'green'}">${t.priority}</span><h4>${t.title}</h4><p>${byId(t.playerId)?.name||'General'} · ${t.owner}</p><div class="task-foot"><span>${dateFmt(t.due)}</span><button class="btn sm" data-advance-task="${t.id}">→</button></div></article>`).join('')}</section>`).join('')}</div>`}
function calendar(){const events=ui.role==='player'?db.events.filter(e=>e.playerId===ui.selectedPlayer):db.events;const days=['2026-07-25','2026-07-26','2026-07-27','2026-07-28','2026-07-29','2026-07-30','2026-07-31'];return `${head('Calendar','Matches, meetings, medical appointments and travel.',`<button class="btn primary" data-open="event">＋ New event</button>`)}<div class="calendar-strip">${days.map((d,i)=>`<div class="day ${i===2?'active':''}"><b>${d.slice(-2)}</b><small>${['Sat','Sun','Mon','Tue','Wed','Thu','Fri'][i]}</small></div>`).join('')}</div><section class="panel"><div class="panel-head"><h3>Agenda</h3><span class="tag">${events.length} events</span></div><div class="panel-body agenda">${events.map(e=>`<article class="agenda-item"><div class="agenda-time"><b>${e.time}</b><small>${dateFmt(e.date)}</small></div><div class="agenda-dot ${e.type==='Medical'?'red':e.type==='Match'?'green':''}"></div><div class="agenda-copy"><b>${e.title}</b><span>${byId(e.playerId)?.name||'Team'} · ${e.location}</span></div><button class="btn sm" data-delete="events:${e.id}">Delete</button></article>`).join('')||'<div class="empty">No events</div>'}</div></section>`}
function messages(){let convs=ui.role==='player'?db.conversations.filter(c=>c.playerId===ui.selectedPlayer):db.conversations;let c=convs.find(x=>x.id===ui.selectedChat)||convs[0];if(c)ui.selectedChat=c.id;return `${head('Messages','Direct conversations with realistic sample threads.')}<section class="panel chat"><aside class="chat-list">${convs.map(x=>`<div class="conversation ${x.id===ui.selectedChat?'active':''}" data-chat="${x.id}"><div class="avatar">${initials(x.name)}</div><div><b>${x.name}</b><small>${x.messages.at(-1)?.text||'No messages'}</small></div></div>`).join('')}</aside>${c?`<div class="chat-pane"><div class="chat-head"><div class="avatar">${initials(c.name)}</div><div><b style="font-size:11px">${c.name}</b><div class="muted" style="font-size:8px">Online · secure demo chat</div></div></div><div class="messages">${c.messages.map(m=>`<div class="bubble ${m.me?'me':''}">${esc(m.text)}<time>${m.time}</time></div>`).join('')}</div><form class="composer" id="message-form"><input name="text" autocomplete="off" placeholder="Write a message…"><button class="btn primary">Send</button></form></div>`:'<div class="empty">No conversations for this role.</div>'}</section>`}
function docsTable(docs){return `<div class="table-wrap"><table class="table"><thead><tr><th>Document</th><th>Player</th><th>Type</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr><td><b>${d.name}</b></td><td>${byId(d.playerId)?.name||'—'}</td><td>${d.type}</td><td><span class="tag ${d.status==='Signed'||d.status==='Confirmed'?'green':d.status==='Private'?'red':'amber'}">${d.status}</span></td><td>${dateFmt(d.date)}</td><td><button class="btn sm" data-doc-action="${d.id}">${d.status==='Signed'?'Preview':'Sign'}</button> <button class="btn sm" data-delete="docs:${d.id}">×</button></td></tr>`).join('')}</tbody></table></div>`}
function documents(){const docs=ui.role==='player'?db.docs.filter(d=>d.playerId===ui.selectedPlayer):db.docs;return `${head('Documents','Contracts, passports, medical files and travel confirmations.',`<button class="btn primary" data-open="document">＋ Upload document</button>`)}<section class="panel"><div class="panel-head"><h3>Document center</h3><span class="tag">${docs.length} files</span></div>${docsTable(docs)}</section>`}
function contracts(){return `${head('Contracts','Contract terms, deadlines and lifecycle status.',`<button class="btn primary" data-open="contract">＋ New contract</button>`)}<section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Club</th><th>Start</th><th>End</th><th>Status</th><th></th></tr></thead><tbody>${db.contracts.map(c=>`<tr><td><b>${byId(c.playerId)?.name}</b></td><td>${c.club}</td><td>${dateFmt(c.start)}</td><td>${dateFmt(c.end)}</td><td><span class="tag green">${c.status}</span></td><td><button class="btn sm" data-delete="contracts:${c.id}">Delete</button></td></tr>`).join('')}</tbody></table></div></section>`}
function transfers(){const stages=['Scouting','Interest','Negotiation','Offer','Closed'];return `${head('Transfer Desk','A live pipeline with editable probability and stage.',`<button class="btn primary" data-open="deal">＋ New case</button>`)}<div class="pipeline">${stages.map(s=>`<section class="pipe-col"><div class="pipe-head"><b>${s}</b><span>${db.deals.filter(d=>d.stage===s).length}</span></div>${db.deals.filter(d=>d.stage===s).map(d=>`<article class="deal"><span class="tag">${byId(d.playerId)?.name}</span><h4>${d.club}</h4><p>${d.probability}% probability</p><strong>${money(d.value)}</strong><div class="score"><i style="width:${d.probability}%"></i></div><button class="btn sm" style="margin-top:9px" data-advance-deal="${d.id}">Move forward →</button></article>`).join('')}</section>`).join('')}</div>`}
function genericTable(type,title,desc,cols,rows,open){return `${head(title,desc,`<button class="btn primary" data-open="${open}">＋ Add record</button>`)}<section class="panel"><div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function scouting(){return genericTable('scouts','Scouting','A growing prospect watchlist with evaluation scores.',['Prospect','Club','Position','Age','Score','Status'],db.scouts.map(s=>`<tr><td><b>${s.name}</b></td><td>${s.club}</td><td>${s.position}</td><td>${s.age}</td><td>${s.score}/100</td><td><span class="tag">${s.status}</span></td><td><button class="btn sm" data-delete="scouts:${s.id}">Delete</button></td></tr>`).join(''),'scout')}
function medical(){let rows=ui.role==='player'?db.medical.filter(m=>m.playerId===ui.selectedPlayer):db.medical;return genericTable('medical','Medical Vault','Private sample reports, fitness and rehabilitation status.',['Player','Report','Date','Status','Note'],rows.map(m=>`<tr><td><b>${byId(m.playerId)?.name}</b></td><td>${m.title}</td><td>${dateFmt(m.date)}</td><td><span class="tag ${m.status==='Fit'?'green':'red'}">${m.status}</span></td><td>${m.note}</td><td><button class="btn sm" data-delete="medical:${m.id}">Delete</button></td></tr>`).join(''),'medical')}
function travel(){let rows=ui.role==='player'?db.trips.filter(t=>t.playerId===ui.selectedPlayer):db.trips;return genericTable('trips','Travel','Flights, hotels and player-care logistics.',['Player','Route','Start','End','Hotel','Status'],rows.map(t=>`<tr><td><b>${byId(t.playerId)?.name}</b></td><td>${t.route}</td><td>${dateFmt(t.start)}</td><td>${dateFmt(t.end)}</td><td>${t.hotel}</td><td><span class="tag ${t.status==='Confirmed'?'green':'amber'}">${t.status}</span></td><td><button class="btn sm" data-delete="trips:${t.id}">Delete</button></td></tr>`).join(''),'trip')}
function sponsors(){let rows=ui.role==='player'?db.sponsors.filter(s=>s.playerId===ui.selectedPlayer):db.sponsors;return genericTable('sponsors','Sponsors','Partnership value, deliverables and campaign status.',['Partner','Player','Value','Status','Deliverable'],rows.map(s=>`<tr><td><b>${s.name}</b></td><td>${byId(s.playerId)?.name}</td><td>€${s.value.toLocaleString('de-DE')}</td><td><span class="tag ${s.status==='Active'?'green':'amber'}">${s.status}</span></td><td>${s.deliverable}</td><td><button class="btn sm" data-delete="sponsors:${s.id}">Delete</button></td></tr>`).join(''),'sponsor')}
function analytics(){const p=byId(ui.selectedPlayer);return `${head(ui.role==='player'?'Performance':'Analytics',ui.role==='player'?'Personal performance and availability overview.':'Portfolio, deal and operational performance.')}<div class="grid metrics"><article class="metric dark"><small>${ui.role==='player'?'Overall rating':'Portfolio value'}</small><strong>${ui.role==='player'?p.rating+'/100':'€52.7m'}</strong><span>Live sample metric</span></article><article class="metric"><small>${ui.role==='player'?'Availability':'Deal probability'}</small><strong>${ui.role==='player'?'94%':'64%'}</strong><span>Rolling 90-day sample</span></article><article class="metric"><small>${ui.role==='player'?'Minutes':'Response time'}</small><strong>${ui.role==='player'?'1,642':'2.4h'}</strong><span>Operational benchmark</span></article><article class="metric"><small>${ui.role==='player'?'Impact':'Tasks completed'}</small><strong>${ui.role==='player'?'+12%':'86%'}</strong><span>vs. previous period</span></article></div><div class="grid two" style="margin-top:12px"><section class="panel"><div class="panel-head"><h3>Performance trend</h3></div><div class="panel-body"><svg viewBox="0 0 600 220" style="width:100%;height:260px"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3bc5ff" stop-opacity=".35"/><stop offset="1" stop-color="#3bc5ff" stop-opacity="0"/></linearGradient></defs><path d="M20 180 C80 160 110 170 160 130 S240 145 285 100 S360 115 410 65 S500 75 580 30 L580 210 L20 210Z" fill="url(#g)"/><path d="M20 180 C80 160 110 170 160 130 S240 145 285 100 S360 115 410 65 S500 75 580 30" fill="none" stroke="#3bc5ff" stroke-width="5" stroke-linecap="round"/></svg></div></section><section class="panel"><div class="panel-head"><h3>Media & brand wall</h3></div><div class="panel-body media-wall"><div class="media-tile tall" style="background-image:url('${photos.player}')"><div class="media-copy"><b>Player focus</b><span>Editorial profile</span></div></div><div class="media-tile" style="background-image:url('${photos.match}')"><div class="media-copy"><b>Matchday</b><span>Performance story</span></div></div><div class="media-tile" style="background-image:url('${photos.stadium}')"><div class="media-copy"><b>Club network</b><span>Transfer visibility</span></div></div></div></section></div>`}
function myspace(){const p=byId(ui.selectedPlayer);return `${head(`Hallo, ${p.name.split(' ')[0]}.`,'Everything important from your management in one place.')}<section class="focus"><div class="focus-img" style="background-image:url('${p.photo}')"><div class="focus-copy"><span class="tag green">Ready</span><h2>${p.name}</h2><p>${p.club} · ${p.position}</p></div></div><div class="focus-side"><div><div class="eyebrow">Next action</div><h3>Contract meeting in Frankfurt</h3><p>27 July · 10:00 · Kennedyallee 113. The new addendum is available in your documents.</p><div class="focus-facts"><div><small>Documents</small><b>${db.docs.filter(d=>d.playerId===p.id).length}</b></div><div><small>Tasks</small><b>${db.tasks.filter(t=>t.playerId===p.id&&t.stage!=='Done').length}</b></div><div><small>Rating</small><b>${p.rating}/100</b></div></div></div><button class="btn primary sm" data-route="documents">Open documents</button></div></section><div class="grid metrics"><article class="metric dark"><small>Next appointment</small><strong>27 Jul</strong><span>Contract meeting</span></article><article class="metric"><small>Unread messages</small><strong>1</strong><span>From management</span></article><article class="metric"><small>Travel</small><strong>${db.trips.filter(t=>t.playerId===p.id).length}</strong><span>Upcoming bookings</span></article><article class="metric"><small>Medical</small><strong>Fit</strong><span>No restriction</span></article></div>`}
function routeView(){if(ui.role==='player'&&ui.route==='dashboard')ui.route='myspace';return ({dashboard,players,tasks,calendar,messages,documents,contracts,transfers,scouting,medical,travel,sponsors,analytics,myspace}[ui.route]||dashboard)()}
function formFields(kind,data={}){const playerSelect=`<div class="field"><label>Player</label><select name="playerId">${db.players.map(p=>`<option value="${p.id}" ${data.playerId==p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>`;const f=(label,name,value='',type='text')=>`<div class="field"><label>${label}</label><input type="${type}" name="${name}" value="${esc(value)}" required></div>`;const s=(label,name,opts,value='')=>`<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select></div>`;if(kind==='player')return `<div class="form-grid">${f('Full name','name',data.name)}${f('Club','club',data.club)}${f('Position','position',data.position)}${f('Age','age',data.age||20,'number')}${f('Market value (€m)','value',data.value||0,'number')}${f('Rating','rating',data.rating||70,'number')}${f('Contract end','contract',data.contract||'2028-06-30','date')}${f('Nation','nation',data.nation||'Germany')}${f('Jersey number','number',data.number||10,'number')}${s('Status','status',['Top flight','2. Bundesliga','Talent','Development','Available','Academy'],data.status)}</div>`;if(kind==='task')return `${f('Task title','title')}${playerSelect}<div class="form-grid">${f('Owner','owner','Player Care')}${f('Due date','due','2026-08-01','date')}${s('Priority','priority',['High','Medium','Low'],'Medium')}${s('Stage','stage',['Today','In progress','Waiting','Done'],'Today')}</div>`;if(kind==='event')return `${f('Title','title')}${playerSelect}<div class="form-grid">${f('Date','date','2026-08-01','date')}${f('Time','time','10:00','time')}${s('Type','type',['Meeting','Match','Medical','Sponsor','Travel'],'Meeting')}${f('Location','location','Frankfurt')}</div>`;if(kind==='document')return `${f('Document name','name','New document.pdf')}${playerSelect}<div class="form-grid">${s('Type','type',['Contract','Medical','Identity','Travel','Presentation'],'Contract')}${s('Status','status',['Draft','Signed','Private','Valid','Confirmed'],'Draft')}${f('Date','date','2026-07-25','date')}</div>`;if(kind==='contract')return `${playerSelect}${f('Club','club')}<div class="form-grid">${f('Start','start','2026-07-01','date')}${f('End','end','2029-06-30','date')}${s('Status','status',['Active','Draft','Expired'],'Active')}</div>`;if(kind==='deal')return `${playerSelect}${f('Club / case','club')}<div class="form-grid">${f('Value (€m)','value',1,'number')}${f('Probability %','probability',50,'number')}${s('Stage','stage',['Scouting','Interest','Negotiation','Offer','Closed'],'Scouting')}</div>`;if(kind==='scout')return `<div class="form-grid">${f('Prospect name','name')}${f('Club','club')}${f('Position','position')}${f('Age','age',18,'number')}${f('Score','score',75,'number')}${s('Status','status',['Watchlist','Contacted','Meeting','Signed'],'Watchlist')}</div>`;if(kind==='medical')return `${playerSelect}${f('Report title','title')}<div class="form-grid">${s('Status','status',['Fit','Rehab','Restricted'],'Fit')}${f('Date','date','2026-07-25','date')}</div><div class="field"><label>Note</label><textarea name="note" rows="4">Sample medical note.</textarea></div>`;if(kind==='trip')return `${playerSelect}${f('Route','route','Frankfurt → ')}<div class="form-grid">${f('Start','start','2026-08-01','date')}${f('End','end','2026-08-03','date')}${f('Hotel','hotel')}${s('Status','status',['Pending','Confirmed','Completed'],'Pending')}</div>`;if(kind==='sponsor')return `${f('Partner','name')}${playerSelect}<div class="form-grid">${f('Value (€)','value',25000,'number')}${s('Status','status',['Negotiation','Active','Completed'],'Negotiation')}</div>${f('Deliverable','deliverable','2 posts + 1 appearance')}`;return ''}
function openModal(kind,editId=null){let data={};if(kind==='player'&&editId)data=byId(editId);ui.modal={kind,editId};const titles={player:'Player profile',task:'Task',event:'Calendar event',document:'Document',contract:'Contract',deal:'Transfer case',scout:'Scouting prospect',medical:'Medical report',trip:'Travel booking',sponsor:'Sponsor partnership'};document.querySelector('#overlay').innerHTML=`<div class="modal-bg" data-action="close-modal"><form class="modal" id="record-form" data-kind="${kind}" data-edit="${editId||''}"><div class="modal-head"><h3>${editId?'Edit':'Create'} ${titles[kind]}</h3><button type="button" class="btn icon" data-action="close-modal">×</button></div><div class="modal-body">${formFields(kind,data)}</div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Save record</button></div></form></div>`}
function submitRecord(form){const kind=form.dataset.kind,editId=Number(form.dataset.edit),o=Object.fromEntries(new FormData(form));['playerId','age','number','rating','probability','score'].forEach(k=>{if(o[k]!=null)o[k]=Number(o[k])});if(o.value!=null)o.value=Number(o.value);const map={player:'players',task:'tasks',event:'events',document:'docs',contract:'contracts',deal:'deals',scout:'scouts',medical:'medical',trip:'trips',sponsor:'sponsors'},arr=db[map[kind]];if(editId){Object.assign(arr.find(x=>x.id===editId),o);if(kind==='player'&&!o.photo)o.photo=photos.player}else{arr.push({id:id(),...o,...(kind==='player'?{photo:photos.player}:{}),...(kind==='contract'?{salary:'Confidential'}:{})})}save();closeModal();toast('Saved',`${kind} record updated`);render()}
function closeModal(){document.querySelector('#overlay').innerHTML='';ui.modal=null}function toast(title,text){let stack=document.querySelector('.toast-stack');if(!stack){stack=document.createElement('div');stack.className='toast-stack';document.body.appendChild(stack)}const t=document.createElement('div');t.className='toast';t.innerHTML=`<div><b>${title}</b><span>${text}</span></div>`;stack.appendChild(t);setTimeout(()=>t.remove(),3200)}
function render(){const app=document.querySelector('#app');app.innerHTML=ui.view==='public'?publicPage():ui.view==='login'?loginPage():shell();bindReveal();setTimeout(()=>document.querySelectorAll('.messages').forEach(x=>x.scrollTop=x.scrollHeight),0)}function bindReveal(){const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.1});document.querySelectorAll('.reveal').forEach(x=>obs.observe(x))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-route],[data-player],[data-player-tab],[data-role-select],[data-open],[data-edit-player],[data-chat],[data-advance-task],[data-advance-deal],[data-delete],[data-doc-action]');if(!b)return;if(b.dataset.action==='login'){ui.role=b.dataset.role;ui.view='login';render()}else if(b.dataset.action==='public'){ui.view='public';render()}else if(b.dataset.action==='enter'){ui.view='app';ui.route=ui.role==='management'?'dashboard':'myspace';ui.selectedPlayer=2;render()}else if(b.dataset.action==='logout'){ui.view='public';render()}else if(b.dataset.action==='menu')document.querySelector('.sidebar')?.classList.toggle('open');else if(b.dataset.action==='reset')reset();else if(b.dataset.action==='notifications'){db.notifications.forEach(n=>n.read=true);save();toast('Notifications','All notifications marked as read');render()}else if(b.dataset.action==='close-modal'){if(e.target.closest('.modal')&&e.target.classList.contains('modal-bg')===false&&e.target.dataset.action==='close-modal'&&e.target.closest('button')==null)return;closeModal()}else if(b.dataset.route){ui.route=b.dataset.route;render()}else if(b.dataset.roleSelect){ui.role=b.dataset.roleSelect;render()}else if(b.dataset.player){ui.selectedPlayer=Number(b.dataset.player);ui.route='players';ui.playerTab='overview';render()}else if(b.dataset.playerTab){ui.playerTab=b.dataset.playerTab;render()}else if(b.dataset.open)openModal(b.dataset.open);else if(b.dataset.editPlayer)openModal('player',Number(b.dataset.editPlayer));else if(b.dataset.chat){ui.selectedChat=Number(b.dataset.chat);render()}else if(b.dataset.advanceTask){const t=db.tasks.find(x=>x.id==b.dataset.advanceTask),st=['Today','In progress','Waiting','Done'];t.stage=st[Math.min(st.indexOf(t.stage)+1,3)];save();toast('Task moved',t.stage);render()}else if(b.dataset.advanceDeal){const d=db.deals.find(x=>x.id==b.dataset.advanceDeal),st=['Scouting','Interest','Negotiation','Offer','Closed'];d.stage=st[Math.min(st.indexOf(d.stage)+1,4)];save();toast('Transfer updated',d.stage);render()}else if(b.dataset.delete){const [arr,idv]=b.dataset.delete.split(':');db[arr]=db[arr].filter(x=>x.id!=idv);save();toast('Deleted','Record removed from demo');render()}else if(b.dataset.docAction){const d=db.docs.find(x=>x.id==b.dataset.docAction);if(d.status!=='Signed'){d.status='Signed';save();toast('Digitally signed',d.name);render()}else toast('Preview','Demo document preview opened')}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='record-form')submitRecord(e.target);if(e.target.id==='message-form'){const text=new FormData(e.target).get('text').trim();if(text){db.conversations.find(c=>c.id===ui.selectedChat).messages.push({me:true,text,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});save();render()}}});document.addEventListener('input',e=>{if(e.target.id==='player-search'){ui.search=e.target.value;render()}});document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-task]');if(t){t.classList.add('dragging');e.dataTransfer.setData('text/plain',t.dataset.task)}});document.addEventListener('dragend',e=>e.target.closest('[data-task]')?.classList.remove('dragging'));document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop-stage]'))e.preventDefault()});document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop-stage]');if(!col)return;e.preventDefault();const t=db.tasks.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(t){t.stage=col.dataset.dropStage;save();toast('Task moved',t.stage);render()}});
render();
</script></body></html>
