function loginView(){return `<section class="login"><div class="login-art"><div class="brand"><div class="brand-mark">XI</div><div class="brand-text"><strong>NEXUS XI</strong><span>PLAYER MANAGEMENT OS</span></div></div><div><div class="kicker">Secure access</div><h1>YOUR CAREER.<br>ONE <em>COMMAND</em><br>CENTER.</h1><p class="muted" style="max-width:540px;line-height:1.7">Exklusiver Zugang für Management, Spieler, Medical Team und autorisierte Partner.</p></div><span class="muted" style="font-size:11px">Encrypted workspace · Role-based access · Audit ready</span></div><div class="login-box"><div class="login-panel"><div class="kicker">Portal Login</div><h2>Willkommen zurück.</h2><p>Wähle eine Rolle und starte direkt in die interaktive Demo.</p><div class="role-choice"><button class="role-card active" data-role="admin"><b>Management</b><span>Vollständiger Admin-Bereich</span></button><button class="role-card" data-role="player"><b>Spieler</b><span>Persönlicher Workspace</span></button></div><div class="field"><label>E-Mail</label><input id="email" value="management@nexusxi.demo"></div><div class="field"><label>Passwort</label><input type="password" value="demo2026"></div><div class="demo-hint">Demo-Zugang ist vorausgefüllt. Es werden ausschließlich fiktive Daten verwendet.</div><button class="btn primary" style="width:100%" data-action="submit-login">Sicher anmelden →</button><button class="btn" style="width:100%;margin-top:9px" data-action="home">Zur öffentlichen Website</button></div></div></section>`}

erfügbarkeit</p></div></div>${D.players.slice(0,4).map(p=>`<div class="list-row">${av(p)}<div class="grow"><b>${p.name}</b><span>${p.status==='Fit'?'Voll belastbar':'Return-to-play Phase 2'}</span></div>${badge(p.status)}</div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h3>Transfer Pulse</h3><p>Aktive Opportunities</p></div></div>${D.deals.slice(0,4).map(d=>`<div class="list-row"><div class="grow"><b>${d.player} → ${d.club}</b><span>${d.value} · ${d.prob}% Wahrscheinlichkeit</span><div class="progress"><i style="width:${d.prob}%"></i></div></div></div>`).join('')}</section></div>`}
function playersPage(){let cards=D.players.map(p=>`<article class="player-card"><div class="player-cover"></div><div class="player-card-body"><div class="player-main">${av(p,'lg')}<div><h3>${p.name}</h3><span>${p.position} · ${p.club}</span></div></div><div class="player-facts"><div class="fact"><small>MARKTWERT</small><b>${p.value}</b></div><div class="fact"><small>RATING</small><b>${p.rating}</b></div><div class="fact"><small>VERTRAG</small><b>${p.contract.slice(-4)}</b></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">${badge(p.status)}<button class="btn" data-player-detail="${p.id}">Spielerakte →</button></div></div></article>`).join('');return `<div class="toolbar"><div class="toolbar-left"><input class="search" id="playerSearch" placeholder="Spieler, Club oder Position suchen"><select class="select" id="statusFilter"><option value="">Alle Status</option><option>Fit</option><option>Reha</option></select></div><div class="toolbar-right"><button class="btn" data-action="toggle-player-view">${S.view==='cards'?'Tabellenansicht':'Kartenansicht'}</button><button class="btn primary" data-action="add-player">+ Spieler anlegen</button></div></div><div id="playerResults">${S.view==='cards'?`<div class="cards">${cards}</div>`:playerTable(D.players)}</div>`}

function chatPage(){let contacts=D.players.slice(0,5),id=S.chatId||S.playerId||'p1';if(S.role==='player')id=S.playerId;let p=D.players.find(x=>x.id===id)||D.players[0],msgs=(S.messages[id]||[]);return `<div class="chat-layout">${S.role==='admin'?`<aside class="chat-list"><input class="search" style="width:100%;min-width:0;margin-bottom:8px" placeholder="Chats durchsuchen">${contacts.map(x=>`<button class="chat-contact ${x.id===id?'active':''}" data-chat="${x.id}">${av(x)}<div><b>${x.name}</b><span>${(S.messages[x.id]||[]).slice(-1)[0]?.[1]||'Neue Unterhaltung starten'}</span></div></button>`).join('')}</aside>`:''}<section class="chat-window"><div class="chat-head">${av(p)}<div><b>${S.role==='player'?'Management Team':p.name}</b><div class="muted" style="font-size:9px;margin-top:3px">● Online · Ende-zu-Ende geschützt</div></div></div><div class="messages">${msgs.map(m=>`<div class="bubble ${m[0]==='me'?'me':''}">${esc(m[1])}<small>${m[2]}</small></div>`).join('')||'<div class="empty">Noch keine Nachrichten.</div>'}</div><div class="chat-compose"><input id="chatInput" placeholder="Nachricht schreiben…"><button class="btn primary" data-action="send-message">Senden</button></div></section></div>`}
function documentsPage(){return `<div class="toolbar"><div class="toolbar-left"><input class="search" id="docSearch" placeholder="Dokumente durchsuchen"><select class="select"><option>Alle Kategorien</option><option>Verträge</option><option>Medizin</option><option>Reisen</option><option>Visa</option></select></div><div class="toolbar-right"><button class="btn primary" data-action="upload-doc">↑ Dokument hochladen</button></div></div><div class="doc-grid" id="docResults">${S.docs.map(docCard).join('')}</div>`}

function playerMedical(){let p=player();return `<div class="metric-grid">${metric('Availability',p.status==='Fit'?'100%':'64%',p.status==='Fit'?'Fully match ready':'Return-to-play phase 2','accent')}${metric('Wellness','8.6 / 10','Sleep & recovery')}${metric('Load','Optimal','ACWR 1.08')}${metric('Next Check','31.07.','Performance screening')}</div><div class="grid-2"><section class="panel"><div class="panel-head"><div><h3>Medical Status</h3><p>Private — only you and authorized medical staff</p></div>${badge(p.status)}</div><div class="profile-hero" style="padding:16px">${av(p,'lg')}<div><h2 style="font-size:20px">${p.status==='Fit'?'Match ready':'Rehabilitation active'}</h2><p>${p.status==='Fit'?'No current restrictions':'Hamstring load management · Target 06.08.'}</p></div></div><div class="list">${[['Last screening','18.07.2026','All markers normal'],['Blood panel','04.07.2026','Optimal'],['Cardio check','12.06.2026','Cleared'],['Dental check','21.05.2026','Complete']].map(x=>`<div class="list-row"><div class="grow"><b>${x[0]}</b><span>${x[1]} · ${x[2]}</span></div><span class="badge green">✓</span></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h3>Wellness Check-in</h3><p>Daily 30-second status</p></div></div>${[['Sleep quality',8],['Energy',9],['Muscle soreness',2],['Stress',3]].map(x=>`<div class="field"><label>${x[0]} · ${x[1]}/10</label><input type="range" min="1" max="10" value="${x[1]}"></div>`).join('')}<button class="btn primary" data-action="wellness">Check-in speichern</button></section></div>`}
function playerSponsors(){let p=player();return `<div class="profile-hero"><div class="avatar xl">${p.sponsor.slice(0,2).toUpperCase()}</div><div class="grow"><div class="kicker">Main Partner</div><h2>${p.sponsor}</h2><p>Personal Equipment & Marketing Partnership · Active through 2028</p><div class="profile-tags"><span class="badge green">Contract active</span><span class="badge">4 campaigns</span></div></div></div><div class="grid-2"><section class="panel"><div class="panel-head"><div><h3>Active Deliverables</h3><p>Content and event obligations</p></div></div>${[['Instagram Matchday Post','29.07.','Review'],['Boot Launch Event','14.08.','Planned'],['Campaign Shooting','03.09.','Confirmed'],['Youth Clinic Appearance','18.10.','Planned']].map(x=>`<div class="list-row"><div class="grow"><b>${x[0]}</b><span>${x[1]}</span></div>${badge(x[2])}</div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h3>Content Approval</h3><p>1 asset needs your approval</p></div><span class="badge orange">Action</span></div><div style="height:190px;border-radius:13px;background:linear-gradient(135deg,#293b50,#0f1c2b);display:grid;place-items:center"><div style="text-align:center"><div style="font-size:44px;font-weight:900">${p.sponsor.toUpperCase()}</div><span class="muted">FW26 CAMPAIGN PREVIEW</span></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" data-action="approve">Freigeben</button><button class="btn" data-action="feedback">Feedback senden</button></div></section></div>`}
function contactsPage(){let p=player();return `<div class="grid-3">${[['Daniel Weber','Managing Partner','+49 171 202 44 10','DW'],['Sofia Klein','Player Relations','+49 176 330 29 81','SK'],['Dr. Felix Lang','Medical Lead','+49 171 991 24 22','FL'],['Miriam Roth','Legal & Contracts','+49 160 672 11 45','MR'],['NEXUS Travel Desk','24/7 Travel Support','+49 69 889 210 00','TR'],['Emergency Line','24/7 Emergency','+49 800 119 11 11','SOS']].map((x,i)=>`<section class="panel"><div class="avatar lg c${(i%6)+1}">${x[3]}</div><h3>${x[0]}</h3><p class="muted" style="font-size:11px">${x[1]}</p><div class="divider"></div><div class="list-row"><div class="grow"><b>${x[2]}</b><span>${i===5?'Always available':'Available now'}</span></div><button class="btn" data-action="call">☎</button></div><button class="btn" style="width:100%" data-route="chat">Nachricht senden</button></section>`).join('')}</div><section class="panel" style="margin-top:12px"><div class="panel-head"><div><h3>My Personal Data</h3><p>Emergency and contact information</p></div><button class="btn" data-action="edit-contact">Bearbeiten</button></div><div class="grid-3"><div class="fact"><small>E-MAIL</small><b>${p.email}</b></div><div class="fact"><small>TELEFON</small><b>${p.phone}</b></div><div class="fact"><small>EMERGENCY CONTACT</small><b>Anna Hartmann · +49 171 555 019</b></div></div></section>`}
function openPlayer(id){let p=D.players.find(x=>x.id===id);modal(`<div class="profile-hero">${av(p,'xl')}<div><div class="kicker">${p.position}</div><h2>${p.name}</h2><p>${p.club} · ${p.country}</p><div class="profile-tags">${badge(p.status)}<span class="badge cyan">${p.value}</span></div></div></div><div class="tabs"><button class="tab active">Overview</button><button class="tab">Career</button><button class="tab">Contracts</button><button class="tab">Performance</button></div><div class="grid-3">${[['Age',p.age],['Height',p.height],['Foot',p.foot],['Apps',p.apps],['Goals',p.goals],['Assists',p.assists]].map(x=>`<div class="fact"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><p class="muted" style="line-height:1.8;font-size:12px">${p.bio}</p><div class="timeline">${p.career.map(c=>`<div class="time-item"><b>${c[0]} · ${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div><h3>Achievements</h3>${p.achievements.map(a=>`<span class="badge orange" style="margin:4px">${a}</span>`).join('')}`,p.name,'Schließen')}
function modal(body,title='NEXUS XI',ok='Speichern'){q('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn icon-btn" data-action="close-modal">×</button></div><div class="modal-body">${body}</div><div class="modal-actions"><button class="btn" data-action="close-modal">Abbrechen</button><button class="btn primary" data-action="modal-save">${ok}</button></div></div></div>`;bindModal()}
function formModal(type){let body='',title='';if(type==='event'){title='Neuen Termin erstellen';body=`<div class="field"><label>Titel</label><input id="mTitle" value="Management Meeting"></div><div class="grid-2" style="margin:0"><div class="field"><label>Datum</label><input id="mDate" type="date" value="2026-07-30"></div><div class="field"><label>Uhrzeit</label><input id="mTime" type="time" value="14:00"></div></div><div class="field"><label>Spieler</label><select id="mPlayer">${D.players.map(p=>`<option>${p.name}</option>`)}</select></div>`}if(type==='task'){title='Aufgabe erstellen';body=`<div class="field"><label>Aufgabe</label><input id="mTitle" value="Neues To-do"></div><div class="field"><label>Spieler</label><select id="mPlayer">${D.players.map(p=>`<option>${p.name}</option>`)}</select></div><div class="field"><label>Priorität</label><select id="mPriority"><option>Hoch</option><option selected>Mittel</option><option>Niedrig</option></select></div>`}if(type==='doc'){title='Dokument hochladen';body=`<div class="field"><label>Dateiname</label><input id="mTitle" value="Neues Dokument.pdf"></div><div class="field"><label>Kategorie</label><select id="mCat"><option>Verträge</option><option>Medizin</option><option>Reisen</option><option>Visa</option></select></div><div class="field"><label>Spieler</label><select id="mPlayer">${D.players.map(p=>`<option>${p.name}</option>`)}</select></div><div class="demo-hint">Demo: Der Upload wird lokal simuliert.</div>`}if(type==='deal'){title='Transfer Opportunity';body=`<div class="field"><label>Spieler</label><select id="mPlayer">${D.players.map(p=>`<option>${p.name}</option>`)}</select></div><div class="field"><label>Interessierter Club</label><input id="mClub" value="FC Europa"></div><div class="field"><label>Potenzial</label><input id="mValue" value="€20M"></div>`}modal(body,title);q('.modal').dataset.form=type}
function bindModal(){qa('[data-action="close-modal"]').forEach(b=>b.onclick=()=>q('#modalRoot').innerHTML='');let sv=q('[data-action="modal-save"]');if(sv)sv.onclick=()=>{let m=q('.modal'),type=m?.dataset.form;if(type==='event')S.events.unshift({date:q('#mDate').value,time:q('#mTime').value,title:q('#mTitle').value,type:'Management',player:q('#mPlayer').value});if(type==='task')S.tasks.unshift({id:Date.now(),title:q('#mTitle').value,player:q('#mPlayer').value,due:'Neu',priority:q('#mPriority').value,status:'Offen'});if(type==='doc')S.docs.unshift({name:q('#mTitle').value,cat:q('#mCat').value,player:q('#mPlayer').value,date:'25.07.2026',size:'1.1 MB',secure:true});if(type==='deal')S.deals.unshift({player:q('#mPlayer').value,club:q('#mClub').value,value:q('#mValue').value,prob:20,status:'Scouting',next:'Initial outreach'});save();q('#modalRoot').innerHTML='';render();toast('Demo-Daten wurden gespeichert.')}}
function bind(){qa('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,b));qa('[data-route]').forEach(b=>b.onclick=()=>{S.route=b.dataset.route;save();render()});qa('[data-player]').forEach(b=>b.onclick=()=>openPlayer(b.dataset.player));qa('[data-player-detail]').forEach(b=>b.onclick=()=>openPlayer(b.dataset.playerDetail));qa('[data-chat]').forEach(b=>b.onclick=()=>{S.chatId=b.dataset.chat;render()});qa('[data-task-next]').forEach(b=>b.onclick=()=>{let t=S.tasks.find(x=>x.id==b.dataset.taskNext),c=['Offen','In Arbeit','Review','Erledigt'];t.status=c[(c.indexOf(t.status)+1)%c.length];save();render();toast('Aufgabe verschoben')});qa('[data-deal-next]').forEach(b=>b.onclick=()=>{let d=S.deals[+b.dataset.dealNext],c=['Scouting','Interesse','Verhandlung','Finalisierung'];d.status=c[Math.min(c.indexOf(d.status)+1,3)];d.prob=Math.min(95,d.prob+20);save();render();toast('Transfer-Phase aktualisiert')});qa('[data-player-complete]').forEach(b=>b.onclick=()=>{let t=S.tasks.find(x=>x.id==b.dataset.playerComplete);t.status='Erledigt';save();render();toast('Aufgabe erledigt')});let ps=q('#playerSwitch');if(ps)ps.onchange=()=>{S.playerId=ps.value;save();render()};let search=q('#playerSearch');if(search)search.oninput=()=>{let term=search.value.toLowerCase(),st=q('#statusFilter').value,arr=D.players.filter(p=>(p.name+' '+p.club+' '+p.position).toLowerCase().includes(term)&&(!st||p.status===st));q('#playerResults').innerHTML=S.view==='cards'?`<div class="cards">${arr.map(p=>`<article class="player-card"><div class="player-cover"></div><div class="player-card-body"><div class="player-main">${av(p,'lg')}<div><h3>${p.name}</h3><span>${p.position} · ${p.club}</span></div></div><div style="margin-top:14px"><button class="btn" data-player-detail="${p.id}">Spielerakte →</button></div></div></article>`).join('')}</div>`:playerTable(arr);bind()};let sf=q('#statusFilter');if(sf)sf.onchange=()=>search.dispatchEvent(new Event('input'));q('.modal-backdrop')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))q('#modalRoot').innerHTML=''})}
function act(a,b){if(a==='home'){S.role=null;S.route='home';save();render();scrollTo(0,0)}else if(a==='login'){S.route='login';render()}else if(a==='demo-admin'){S.role='admin';S.route='dashboard';save();render()}else if(a==='demo-player'){S.role='player';S.route='dashboard';S.playerId='p1';save();render()}else if(a==='submit-login'){let role=q('.role-card.active')?.dataset.role||'admin';S.role=role;S.route='dashboard';save();render();toast('Sicher in der Demo angemeldet')}else if(a==='logout'){S.role=null;S.route='login';save();render()}else if(a==='menu'){q('.shell').classList.add('menu-open')}else if(a==='close-menu'){q('.shell').classList.remove('menu-open')}else if(a==='new-event')formModal('event');else if(a==='new-task')formModal('task');else if(a==='upload-doc'||a==='upload-medical'||a==='upload-personal')formModal('doc');else if(a==='new-deal')formModal('deal');else if(a==='toggle-player-view'){S.view=S.view==='cards'?'table':'cards';save();render()}else if(a==='send-message'){let input=q('#chatInput');if(!input.value.trim())return;let id=S.role==='player'?S.playerId:(S.chatId||'p1');S.messages[id]=S.messages[id]||[];S.messages[id].push(['me',input.value.trim(),'Jetzt']);save();render();toast('Nachricht gesendet')}else if(a==='switch'){b.classList.toggle('on');toast('Einstellung aktualisiert')}else if(a==='reset-demo'){localStorage.removeItem('nexus-demo');location.reload()}else if(a==='modal-save'){}else if(['notify','add-player','new-report','scout-detail','campaign','export','save-settings','invite','request-appointment','book-appointment','download-trip','personal-task','play-video','wellness','approve','feedback','call','edit-contact','emergency','sign'].includes(a)){toast(a==='export'?'Report wird für die Demo erzeugt…':'Aktion erfolgreich simuliert')}else toast('Demo-Aktion ausgeführt')}
document.addEventListener('click',e=>{let r=e.target.closest('.role-card');if(r){qa('.role-card').forEach(x=>x.classList.remove('active'));r.classList.add('active');let em=q('#email');if(em)em.value=r.dataset.role==='admin'?'management@nexusxi.demo':'luca@nexusxi.demo'}});render();
</script>
</body></html>
