name: Deploy A+ Solution Football Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: aplus-football-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_API: https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state pending --arg target_url "$RUN_URL" --arg description "Deploying compact mobile controls V22" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/status.json

      - name: Check deployment secrets
        run: |
          test -n "$SERVER_HOST"
          test -n "$ROOT_PASSWORD"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_HOST" 'curl -fsSL https://raw.githubusercontent.com/hsdarestani/football/main/deploy.sh | bash'

      - name: Verify V22 server files
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_HOST" 'set -e; cd /opt/apex-xi; docker compose ps; docker compose exec -T app sh -c "test -f /usr/share/nginx/html/assets/css/v22-mobile-controls.css && grep -Fq app.js?v=22 /usr/share/nginx/html/index.html && grep -Fq v22-mobile-controls.css?v=22 /usr/share/nginx/html/index.html && grep -Fq oversizedControls /usr/share/nginx/html/assets/js/app.js && grep -Fq spotlight-actions /usr/share/nginx/html/assets/css/v22-mobile-controls.css && grep -Fq hero-actions /usr/share/nginx/html/assets/css/v22-mobile-controls.css"'

      - name: Verify real mobile CTA dimensions
        id: public
        continue-on-error: true
        shell: bash
        run: |
          set -e
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/ -o /tmp/home
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/css/v22-mobile-controls.css -o /tmp/control-css
          grep -Fq 'app.js?v=22' /tmp/home
          grep -Fq 'v22-mobile-controls.css?v=22' /tmp/home
          grep -Fq '.btn>svg' /tmp/control-css
          grep -Fq 'max-height:54px' /tmp/control-css
          grep -Fq 'max-height:52px' /tmp/control-css

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          CHROME_ARGS="--headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=12000"

          $BROWSER $CHROME_ARGS --window-size=390,844 --dump-dom 'https://football.smarbiz.sbs/?mobilecheck=1' > /tmp/public-mobile.html
          $BROWSER $CHROME_ARGS --window-size=390,844 --dump-dom 'https://football.smarbiz.sbs/?spotlight=younes&mobilecheck=1' > /tmp/spotlight-mobile.html
          $BROWSER $CHROME_ARGS --window-size=390,844 --dump-dom 'https://football.smarbiz.sbs/?demo=player&route=calendar&player=younes&mobilecheck=1' > /tmp/player-mobile.html

          for file in /tmp/public-mobile.html /tmp/spotlight-mobile.html /tmp/player-mobile.html; do
            grep -Fq 'id="mobile-diagnostics"' "$file"
            grep -Fq 'data-overflow="false"' "$file"
            grep -Fq 'data-oversized-controls="false"' "$file"
          done

          grep -Fq 'Management-Demo öffnen' /tmp/public-mobile.html
          grep -Fq 'data-max-control-height="54"' /tmp/public-mobile.html
          grep -Fq 'data-max-control-svg="20"' /tmp/public-mobile.html
          grep -Fq 'spotlight-shell' /tmp/spotlight-mobile.html
          grep -Fq 'data-spotlight="true"' /tmp/spotlight-mobile.html
          grep -Fq 'data-max-control-height="52"' /tmp/spotlight-mobile.html
          grep -Fq 'data-max-control-svg="19"' /tmp/spotlight-mobile.html
          grep -Fq 'data-player-view="calendar"' /tmp/player-mobile.html
          grep -Fq 'data-home-buttons="2"' /tmp/player-mobile.html

          $BROWSER $CHROME_ARGS --window-size=390,844 --screenshot=/tmp/public-mobile-v22.png 'https://football.smarbiz.sbs/'
          $BROWSER $CHROME_ARGS --window-size=390,844 --screenshot=/tmp/spotlight-mobile-v22.png 'https://football.smarbiz.sbs/?spotlight=younes'
          $BROWSER $CHROME_ARGS --window-size=430,932 --screenshot=/tmp/player-mobile-v22.png 'https://football.smarbiz.sbs/?demo=player&route=calendar&player=younes'
          test -s /tmp/public-mobile-v22.png
          test -s /tmp/spotlight-mobile-v22.png
          test -s /tmp/player-mobile-v22.png

      - name: Upload V22 mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-controls-v22-${{ github.run_number }}
          path: |
            /tmp/public-mobile-v22.png
            /tmp/spotlight-mobile-v22.png
            /tmp/player-mobile-v22.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish deployment success
        if: steps.public.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state success --arg target_url "$RUN_URL" --arg description "Mobile CTA and spotlight controls V22 pass computed-size tests" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json

      - name: Publish deployment failure
        if: always() && steps.public.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state failure --arg target_url "$RUN_URL" --arg description "Mobile V22 control verification failed; open workflow logs" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json
          exit 1