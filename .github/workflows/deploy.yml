name: Deploy A+ Solution Football Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: aplus-football-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_API: https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state pending --arg target_url "$RUN_URL" --arg description "Deploying final mobile sidebar and chat polish V24" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/status.json

      - name: Check deployment secrets
        run: |
          test -n "$SERVER_HOST"
          test -n "$ROOT_PASSWORD"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          SCRIPT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/deploy.sh"
          sshpass -e ssh -p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_HOST" "curl -fsSL '$SCRIPT_URL' | bash"

      - name: Verify V24 server files
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_HOST" 'set -e; cd /opt/apex-xi; docker compose ps; docker compose exec -T app test -f /usr/share/nginx/html/assets/css/v23-mobile-menu-chat.css; docker compose exec -T app grep -Fq app.js?v=24 /usr/share/nginx/html/index.html; docker compose exec -T app grep -Fq v23-mobile-menu-chat.css?v=24 /usr/share/nginx/html/index.html; docker compose exec -T app grep -Fq menuHomeOverlap /usr/share/nginx/html/assets/js/app.js; docker compose exec -T app grep -Fq chatLayoutBroken /usr/share/nginx/html/assets/js/app.js'

      - name: Verify mobile sidebar and compact chat
        id: public
        continue-on-error: true
        shell: bash
        run: |
          set -e
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/ -o /tmp/home
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/css/v23-mobile-menu-chat.css -o /tmp/v24-css
          grep -Fq 'app.js?v=24' /tmp/home
          grep -Fq 'v23-mobile-menu-chat.css?v=24' /tmp/home
          grep -Fq '.sidebar-scroll' /tmp/v24-css
          grep -Fq '.chat-contacts>.player-row' /tmp/v24-css
          grep -Fq 'body:has(.chat-demo) .floating-create' /tmp/v24-css
          grep -Fq 'min-height:220px' /tmp/v24-css

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          CHROME_ARGS="--headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=12000"

          $BROWSER $CHROME_ARGS --window-size=390,844 --dump-dom 'https://football.smarbiz.sbs/?demo=management&route=dashboard&menu=1&mobilecheck=1' > /tmp/menu-390.html
          $BROWSER $CHROME_ARGS --window-size=390,844 --dump-dom 'https://football.smarbiz.sbs/?demo=management&route=communication&mobilecheck=1' > /tmp/chat-management-390.html
          $BROWSER $CHROME_ARGS --window-size=430,932 --dump-dom 'https://football.smarbiz.sbs/?demo=management&route=communication&mobilecheck=1' > /tmp/chat-management-430.html
          $BROWSER $CHROME_ARGS --window-size=390,844 --dump-dom 'https://football.smarbiz.sbs/?demo=player&route=communication&player=younes&mobilecheck=1' > /tmp/chat-player-390.html

          for file in /tmp/menu-390.html /tmp/chat-management-390.html /tmp/chat-management-430.html /tmp/chat-player-390.html; do
            grep -Fq 'id="mobile-diagnostics"' "$file"
            grep -Fq 'data-overflow="false"' "$file"
          done

          grep -Fq 'data-sidebar="true"' /tmp/menu-390.html
          grep -Fq 'data-menu-home-overlap="false"' /tmp/menu-390.html
          grep -Fq 'data-home-foot-overlap="false"' /tmp/menu-390.html
          grep -Fq 'class="sidebar-home-link"' /tmp/menu-390.html

          for file in /tmp/chat-management-390.html /tmp/chat-management-430.html /tmp/chat-player-390.html; do
            grep -Fq 'chat-demo' "$file"
            grep -Fq 'data-chat-layout-broken="false"' "$file"
            grep -Fq 'data-chat-floating-create="false"' "$file"
            grep -Eq 'data-max-chat-contact-height="([0-8]?[0-9]|9[0-6])"' "$file"
            ! grep -Fq 'class="floating-create"' "$file"
          done

          grep -Fq 'Nachricht schreiben' /tmp/chat-management-390.html
          grep -Fq 'message-compose' /tmp/chat-management-390.html
          grep -Fq 'Dein Management-Chat' /tmp/chat-player-390.html

          $BROWSER $CHROME_ARGS --window-size=390,844 --screenshot=/tmp/mobile-menu-v24.png 'https://football.smarbiz.sbs/?demo=management&route=dashboard&menu=1'
          $BROWSER $CHROME_ARGS --window-size=390,844 --screenshot=/tmp/mobile-chat-management-v24.png 'https://football.smarbiz.sbs/?demo=management&route=communication'
          $BROWSER $CHROME_ARGS --window-size=430,932 --screenshot=/tmp/mobile-chat-management-430-v24.png 'https://football.smarbiz.sbs/?demo=management&route=communication'
          $BROWSER $CHROME_ARGS --window-size=390,844 --screenshot=/tmp/mobile-chat-player-v24.png 'https://football.smarbiz.sbs/?demo=player&route=communication&player=younes'
          test -s /tmp/mobile-menu-v24.png
          test -s /tmp/mobile-chat-management-v24.png
          test -s /tmp/mobile-chat-management-430-v24.png
          test -s /tmp/mobile-chat-player-v24.png

      - name: Upload V24 mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-menu-chat-v24-${{ github.run_number }}
          path: |
            /tmp/mobile-menu-v24.png
            /tmp/mobile-chat-management-v24.png
            /tmp/mobile-chat-management-430-v24.png
            /tmp/mobile-chat-player-v24.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish deployment success
        if: steps.public.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state success --arg target_url "$RUN_URL" --arg description "Mobile sidebar and chat V24 pass final layout tests" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json

      - name: Publish deployment failure
        if: always() && steps.public.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state failure --arg target_url "$RUN_URL" --arg description "Mobile sidebar/chat V24 verification failed; open logs" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json
          exit 1