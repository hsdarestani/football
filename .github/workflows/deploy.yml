name: Deploy NEXUS XI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nexus-xi-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n \
            --arg state "pending" \
            --arg target_url "$RUN_URL" \
            --arg description "Deploying NEXUS XI to production" \
            --arg context "production/deployment" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/pending.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @/tmp/pending.json

      - name: Check deployment secrets
        shell: bash
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$ROOT_PASSWORD" ]; then
            echo "SERVER_HOST or ROOT_PASSWORD is missing."
            exit 1
          fi

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh \
            -p "$PORT" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/hsdarestani/football/main/deploy.sh | bash'

      - name: Verify HTTPS deployment
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 20 https://football.smarbiz.sbs/ | grep -q "NEXUS XI"; then
              echo "Production is healthy: https://football.smarbiz.sbs"
              exit 0
            fi
            echo "Health check attempt ${attempt}/24 failed; retrying..."
            sleep 5
          done
          echo "Production health check failed."
          exit 1

      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="NEXUS XI is live and healthy"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            STATE="error"
            DESCRIPTION="Production deployment was cancelled"
          else
            STATE="failure"
            DESCRIPTION="Production deployment or health check failed"
          fi
          jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context "production/deployment" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @/tmp/status.json
