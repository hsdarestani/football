name: Deploy A+ Solution Football Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: aplus-football-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_API: https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state pending --arg target_url "$RUN_URL" --arg description "Deploying Matchday and product experience V18" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/status.json

      - name: Check deployment secrets
        run: |
          test -n "$SERVER_HOST"
          test -n "$ROOT_PASSWORD"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_HOST" 'curl -fsSL https://raw.githubusercontent.com/hsdarestani/football/main/deploy.sh | bash'

      - name: Verify server files
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_HOST" 'set -e; cd /opt/apex-xi; docker compose ps; docker compose exec -T app sh -c "test -f /usr/share/nginx/html/assets/js/product-experience.js && test -f /usr/share/nginx/html/assets/css/v18-experience.css && grep -Fq app.js?v=18 /usr/share/nginx/html/index.html && grep -Fq v18-experience.css?v=18 /usr/share/nginx/html/index.html && grep -Fq Matchday.Command.Center /usr/share/nginx/html/assets/js/product-experience.js && grep -Fq Karriere-Timeline /usr/share/nginx/html/assets/js/product-experience.js && grep -Fq notification-drawer /usr/share/nginx/html/assets/css/v18-experience.css && grep -Fq floating-create /usr/share/nginx/html/assets/css/v18-experience.css"'

      - name: Verify complete V18 experience
        id: public
        continue-on-error: true
        shell: bash
        run: |
          set -e
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/ -o /tmp/home
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/js/product-experience.js -o /tmp/experience-js
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/css/v18-experience.css -o /tmp/experience-css
          grep -Fq 'app.js?v=18' /tmp/home
          grep -Fq 'v18-experience.css?v=18' /tmp/home
          grep -Fq 'Matchday Command Center' /tmp/experience-js
          grep -Fq 'Karriere-Timeline' /tmp/experience-js
          grep -Fq 'Schnellaktion' /tmp/experience-js
          grep -Fq 'Benachrichtigungen' /tmp/experience-js
          grep -Fq 'Demo Tour' /tmp/experience-js
          grep -Fq 'matchday-hero' /tmp/experience-css
          grep -Fq 'notification-drawer' /tmp/experience-css

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom 'https://football.smarbiz.sbs/?demo=management&route=matchday' > /tmp/matchday-dom
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom 'https://football.smarbiz.sbs/?demo=management&route=players&player=younes' > /tmp/player-dom
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom 'https://football.smarbiz.sbs/?demo=management&route=dashboard&tour=1' > /tmp/tour-dom
          grep -Fq 'matchday-hero' /tmp/matchday-dom
          grep -Fq 'data-matchday-countdown' /tmp/matchday-dom
          grep -Fq 'Tagesablauf' /tmp/matchday-dom
          grep -Fq 'career-timeline' /tmp/player-dom
          grep -Fq 'Karriere-Timeline' /tmp/player-dom
          grep -Fq 'floating-create' /tmp/player-dom
          grep -Fq 'tour-layer' /tmp/tour-dom
          grep -Fq 'Demo Tour' /tmp/tour-dom

      - name: Publish deployment success
        if: steps.public.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state success --arg target_url "$RUN_URL" --arg description "Matchday, tour, actions, notifications and timeline V18 are live" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json

      - name: Publish deployment failure
        if: always() && steps.public.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state failure --arg target_url "$RUN_URL" --arg description "V18 product experience verification failed; open logs" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json
          exit 1