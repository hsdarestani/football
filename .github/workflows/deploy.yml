name: Deploy A+ Solution Football Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: aplus-football-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_API: https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state pending --arg target_url "$RUN_URL" \
            --arg description "Deploying modular A+ Solution Football Suite" \
            --arg context "production/deployment" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/status.json

      - name: Check deployment secrets
        run: |
          test -n "$SERVER_HOST" || { echo "SERVER_HOST is missing"; exit 1; }
          test -n "$ROOT_PASSWORD" || { echo "ROOT_PASSWORD is missing"; exit 1; }

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/hsdarestani/football/main/deploy.sh | bash'

      - name: Verify server container
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" \
            -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'set -e; cd /opt/apex-xi; docker compose ps; docker compose exec -T app sh -c "wget -qO- http://127.0.0.1/ | grep -Fq \"A+ Solution GmbH\" && wget -qO- http://127.0.0.1/assets/js/data.js | grep -Fq \"KI-Dokumentensuche\" && wget -qO- http://127.0.0.1/assets/js/pages-public.js | grep -Fq \"Produktvision\""'

      - name: Verify public HTTPS
        id: public
        continue-on-error: true
        shell: bash
        run: |
          set +e
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/ -o /tmp/home
          HOME_RC=$?
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/js/data.js?v=10 -o /tmp/data
          DATA_RC=$?
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/css/pages.css?v=10 -o /tmp/css
          CSS_RC=$?
          set -e
          test "$HOME_RC" -eq 0
          test "$DATA_RC" -eq 0
          test "$CSS_RC" -eq 0
          grep -Fq "A+ Solution GmbH" /tmp/home
          grep -Fq "KI-Dokumentensuche" /tmp/data
          grep -Fq "public-hero" /tmp/css

      - name: Publish deployment success
        if: steps.public.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state success --arg target_url "$RUN_URL" --arg description "A+ Solution modular demo is live and healthy" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json

      - name: Publish deployment failure
        if: always() && steps.public.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state failure --arg target_url "$RUN_URL" --arg description "A+ Solution deployment failed; open workflow logs" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json
          exit 1
