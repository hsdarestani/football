name: Deploy NEXUS XI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nexus-xi-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state pending --arg target_url "$RUN_URL" \
            --arg description "Deploying NEXUS XI to production" \
            --arg context "production/deployment" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/pending.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @/tmp/pending.json

      - name: Check deployment secrets
        shell: bash
        run: |
          test -n "$SERVER_HOST" || { echo "SERVER_HOST is missing"; exit 1; }
          test -n "$ROOT_PASSWORD" || { echo "ROOT_PASSWORD is missing"; exit 1; }

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh \
            -p "$PORT" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/hsdarestani/football/main/deploy.sh | bash'

      - name: Verify containers and app on server
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh \
            -p "$PORT" \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'set -e; cd /opt/apex-xi; docker compose ps; docker compose exec -T app sh -c "wget -qO- http://127.0.0.1/ | grep -q NEXUS.XI"; echo "Internal app health check passed"; docker compose logs --tail=60 caddy'

      - name: Diagnose DNS
        shell: bash
        run: |
          echo "Resolved IPv4 addresses:"
          getent ahostsv4 football.smarbiz.sbs || true
          echo "HTTP headers:"
          curl -vI --connect-timeout 5 --max-time 10 http://football.smarbiz.sbs/ || true

      - name: Verify public HTTPS deployment
        shell: bash
        run: |
          for attempt in $(seq 1 8); do
            echo "HTTPS health check ${attempt}/8"
            if curl -fsSL --connect-timeout 5 --max-time 10 https://football.smarbiz.sbs/ | grep -q "NEXUS XI"; then
              echo "Production is healthy: https://football.smarbiz.sbs"
              exit 0
            fi
            sleep 5
          done
          echo "Final HTTPS diagnostics:"
          curl -vkI --connect-timeout 5 --max-time 15 https://football.smarbiz.sbs/ || true
          exit 1

      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION="NEXUS XI is live and healthy"
          elif [ "$JOB_STATUS" = cancelled ]; then
            STATE=error
            DESCRIPTION="Production deployment was cancelled"
          else
            STATE=failure
            DESCRIPTION="Open workflow logs for deployment diagnostics"
          fi
          jq -n --arg state "$STATE" --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" --arg context "production/deployment" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @/tmp/status.json
