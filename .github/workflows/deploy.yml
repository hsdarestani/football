name: Deploy Atlasgames Management

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: atlasgames-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_API: https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state pending --arg target_url "$RUN_URL" \
            --arg description "Deploying the German Atlasgames V8 interface" \
            --arg context "production/deployment" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$STATUS_API" --data-binary @/tmp/status.json

      - name: Check deployment secrets
        shell: bash
        run: |
          test -n "$SERVER_HOST" || { echo "SERVER_HOST is missing"; exit 1; }
          test -n "$ROOT_PASSWORD" || { echo "ROOT_PASSWORD is missing"; exit 1; }

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/hsdarestani/football/main/deploy.sh | bash'

      - name: Verify containers and German V8 interface
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" \
            -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'set -e; cd /opt/apex-xi; docker compose ps; docker compose exec -T app sh -c "wget -qO- http://127.0.0.1/ | grep -q v8-de.css && wget -qO- http://127.0.0.1/v8-de.css | grep -q HOHER.KONTRAST && wget -qO- http://127.0.0.1/v7-fixes.js | grep -q Digitales.Fußballbüro"; docker compose logs --tail=80 caddy'
          jq -n --arg state success --arg target_url "$RUN_URL" --arg description "Containers serve the German Atlasgames V8 interface" --arg context "diagnostic/server-app-ok" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/server.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/server.json

      - name: Diagnose public endpoint
        id: public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          post_status() {
            local state="$1" context="$2" description="$3"
            jq -n --arg state "$state" --arg target_url "$RUN_URL" --arg description "$description" --arg context "$context" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/diag.json
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/diag.json >/dev/null
          }

          DOMAIN_IPS="$(getent ahostsv4 football.smarbiz.sbs | awk '{print $1}' | sort -u || true)"
          HOST_IPS="$(getent ahostsv4 "$SERVER_HOST" | awk '{print $1}' | sort -u || true)"
          if [ -z "$DOMAIN_IPS" ]; then
            post_status failure diagnostic/dns-unresolved "Domain has no resolvable IPv4 address"
          elif comm -12 <(printf '%s\n' "$DOMAIN_IPS" | sort) <(printf '%s\n' "$HOST_IPS" | sort) | grep -q .; then
            post_status success diagnostic/dns-match "Domain resolves to the deployment server"
          else
            post_status failure diagnostic/dns-mismatch "Domain is proxied or resolves through another public endpoint"
          fi

          set +e
          HTTP_CODE="$(curl -sS -o /tmp/http-body -w '%{http_code}' --connect-timeout 5 --max-time 12 http://football.smarbiz.sbs/)"
          HTTP_RC=$?
          set -e
          if [ "$HTTP_RC" -eq 0 ]; then
            post_status success "diagnostic/http-${HTTP_CODE}" "Public HTTP endpoint responded"
          else
            post_status failure "diagnostic/http-curl-${HTTP_RC}" "Public HTTP connection failed"
          fi

          set +e
          HTTPS_CODE="$(curl -sS -L -o /tmp/https-body -w '%{http_code}' --connect-timeout 5 --max-time 15 https://football.smarbiz.sbs/)"
          HTTPS_RC=$?
          set -e
          if [ "$HTTPS_RC" -eq 0 ] && grep -q "v8-de.css?v=8-de" /tmp/https-body \
             && curl -fsS https://football.smarbiz.sbs/v8-de.css?v=8-de | grep -q "HOHER KONTRAST" \
             && curl -fsS https://football.smarbiz.sbs/v7-fixes.js?v=8-de | grep -q "Digitales Fußballbüro"; then
            post_status success diagnostic/https-live "HTTPS serves the German Atlasgames V8 interface"
            exit 0
          fi

          set +e
          INSECURE_CODE="$(curl -ksS -L -o /tmp/insecure-body -w '%{http_code}' --connect-timeout 5 --max-time 15 https://football.smarbiz.sbs/)"
          INSECURE_RC=$?
          set -e
          if [ "$INSECURE_RC" -eq 0 ] && grep -q "v8-de.css?v=8-de" /tmp/insecure-body; then
            post_status failure diagnostic/https-cert-only "Atlasgames V8 is reachable but TLS validation fails"
          elif [ "$HTTPS_RC" -eq 6 ]; then
            post_status failure diagnostic/https-dns-error "HTTPS failed because DNS could not resolve"
          elif [ "$HTTPS_RC" -eq 7 ]; then
            post_status failure diagnostic/https-connection-refused "HTTPS port is closed or refused"
          elif [ "$HTTPS_RC" -eq 28 ]; then
            post_status failure diagnostic/https-timeout "HTTPS timed out; check firewall and ports"
          elif [ "$HTTPS_RC" -eq 60 ]; then
            post_status failure diagnostic/https-cert-error "TLS certificate is invalid or unavailable"
          else
            post_status failure "diagnostic/https-rc-${HTTPS_RC}-http-${HTTPS_CODE}" "HTTPS did not serve the expected German V8 interface"
          fi
          exit 1

      - name: Publish deployment success
        if: steps.public.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state success --arg target_url "$RUN_URL" --arg description "Atlasgames V8 is live, German and healthy" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json

      - name: Publish deployment failure
        if: always() && steps.public.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state failure --arg target_url "$RUN_URL" --arg description "Open diagnostic commit statuses or workflow logs" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json
          exit 1