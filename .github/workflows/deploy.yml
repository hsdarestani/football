name: Deploy A+ Solution Football Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: aplus-football-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_API: https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state pending --arg target_url "$RUN_URL" \
            --arg description "Deploying A+ Football Suite V13 media and motion" \
            --arg context "production/deployment" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/status.json

      - name: Check deployment secrets
        run: |
          test -n "$SERVER_HOST" || { echo "SERVER_HOST is missing"; exit 1; }
          test -n "$ROOT_PASSWORD" || { echo "ROOT_PASSWORD is missing"; exit 1; }

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to production
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/hsdarestani/football/main/deploy.sh | bash'

      - name: Verify server container
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$ROOT_PASSWORD"
          sshpass -e ssh -p "$PORT" \
            -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@"$SERVER_HOST" \
            'set -e; cd /opt/apex-xi; docker compose ps; docker compose exec -T app sh -c "wget -qO- http://127.0.0.1/ | grep -Fq app.js?v=13 && wget -qO- http://127.0.0.1/ | grep -Fq v13-football.css?v=13 && wget -qO- http://127.0.0.1/assets/js/motion.js | grep -Fq football-cursor && wget -qO- http://127.0.0.1/assets/js/media.js | grep -Fq media.eintracht.de && wget -qO- http://127.0.0.1/assets/js/media.js | grep -Fq assets.bundesliga.com && wget -qO- http://127.0.0.1/assets/js/media.js | grep -Fq www.vfb.de"'

      - name: Verify public HTTPS and rendered motion
        id: public
        continue-on-error: true
        shell: bash
        run: |
          set -e
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/ -o /tmp/home
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/css/v13-football.css -o /tmp/motion-css
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/js/motion.js -o /tmp/motion-js
          curl -fsSL --connect-timeout 7 --max-time 20 https://football.smarbiz.sbs/assets/js/media.js -o /tmp/media
          grep -Fq "app.js?v=13" /tmp/home
          grep -Fq "v13-football.css?v=13" /tmp/home
          grep -Fq "football-cursor" /tmp/motion-css
          grep -Fq "mountMotion" /tmp/motion-js
          grep -Fq "hero_ebnoutalib" /tmp/media
          grep -Fq "18-Leweling" /tmp/media
          grep -Fq "dfl-obj-002ge4" /tmp/media

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom \
            'https://football.smarbiz.sbs/?demo=management&route=players&player=younes' > /tmp/player-dom
          grep -Fq 'Eintracht Frankfurt' /tmp/player-dom
          grep -Fq 'hero_ebnoutalib' /tmp/player-dom
          grep -Fq 'tilt-ready' /tmp/player-dom

      - name: Publish deployment success
        if: steps.public.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state success --arg target_url "$RUN_URL" --arg description "Official player media and football motion V13 are live" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json

      - name: Publish deployment failure
        if: always() && steps.public.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jq -n --arg state failure --arg target_url "$RUN_URL" --arg description "V13 media or motion verification failed; open workflow logs" --arg context "production/deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/final.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_API" --data-binary @/tmp/final.json
          exit 1